[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wizardset-enhanced"
version = "0.1.0"
description = "A beginner-friendly Python utility package for clean reusable function patterns."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Rory Campbell" }
]
keywords = [
    "python",
    "utilities",
    "learning-python",
    "iterables",
    "data-structures",
    "beginner-friendly",
    "helper-functions",
    "dictionary-utils",
    "list-utils"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/rcampbell30/Wizardset"
Repository = "https://github.com/rcampbell30/Wizardset"
Issues = "https://github.com/rcampbell30/Wizardset/issues"

[tool.setuptools.packages.find]
include = ["wizardset_enhanced*"]
